# Deploy the Web SPA to Azure Static Web Apps.
#   push to main -> Prod environment    push to test -> Test environment
#   pull requests -> ephemeral preview environment (closed automatically on merge/close)
#
# Vite inlines VITE_* at build time. These are read from GitHub Environment variables
# (Settings -> Environments -> prod/test -> Variables) so each environment points at its
# own backend URLs. The deployment token is an Environment secret.
#
# Per-environment GitHub Environment ("prod" and "test") configuration:
#   Variables: VITE_API_IDENTITY_URL, VITE_API_ENGLISH_URL, VITE_API_DEUTSCH_URL, VITE_API_CHAT_PRACTICE_URL
#   Secret:    AZURE_STATIC_WEB_APPS_API_TOKEN
name: Azure Static Web Apps

on:
  push:
    branches:
      - main
      - test
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - test

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    # main -> prod environment, anything else (test branch / PRs targeting test) -> test environment
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_IDENTITY_URL: ${{ vars.VITE_API_IDENTITY_URL }}
          VITE_API_ENGLISH_URL: ${{ vars.VITE_API_ENGLISH_URL }}
          VITE_API_DEUTSCH_URL: ${{ vars.VITE_API_DEUTSCH_URL }}
          VITE_API_CHAT_PRACTICE_URL: ${{ vars.VITE_API_CHAT_PRACTICE_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          output_location: "dist"
          app_build_command: "npm run build"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'prod' || 'test' }}
    name: Close Pull Request Preview
    steps:
      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
